[project]
name = "speedy-tfl"
version = "0.0.0"
description = "Workspace root for tfl-sdk and tfl-walk"
requires-python = ">=3.11"
dependencies = ["tfl-sdk", "tfl-walk"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tfl-sdk = { workspace = true }
tfl-walk = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/tfl-sdk/tests", "packages/tfl-walk/tests"]
pythonpath = ["packages/tfl-sdk/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "ANN"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = [
    "packages/tfl-sdk/src",
    "packages/tfl-sdk/tests",
    "packages/tfl-walk/src",
    "packages/tfl-walk/tests",
]
mypy_path = "packages/tfl-sdk/tests"
explicit_package_bases = true
