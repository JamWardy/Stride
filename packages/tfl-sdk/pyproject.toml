[project]
name = "tfl-sdk"
version = "0.1.0"
description = "Unofficial, typed Python SDK for the TfL Unified API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "tzdata; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfl"]
